<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred German Training</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #334155;
      --danger: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0;
      text-align: center;
      color: var(--text);
    }

    .status {
      font-size: 0.9rem;
      color: var(--text-dim);
      text-align: center;
      min-height: 1.2rem;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    input[type="text"], select {
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"] {
      flex: 1;
    }

    select {
      flex: 2;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .counter {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .original-text {
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .ipa-text {
      font-size: 1.05rem;
      color: var(--primary);
      font-family: monospace;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    button, a.btn-link {
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, border-color 0.2s;
    }

    button:hover:not(:disabled), a.btn-link:hover:not(.disabled) {
      background-color: var(--border);
    }

    button:disabled, a.btn-link.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #playOriginal {
      background-color: var(--primary);
      border-color: var(--primary);
      color: white;
      font-weight: 500;
    }

    #playOriginal:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kindred German Training</h1>
    <div id="status" class="status">로딩 중...</div>

    <div class="controls">
      <input type="text" id="search" placeholder="문장 검색 (ID, 텍스트, IPA)...">
      <select id="sentenceSelect"></select>
    </div>

    <div class="card">
      <div id="counter" class="counter">0 / 0</div>
      <div id="original" class="original-text">문장을 불러오는 중입니다...</div>
      <div id="ipa" class="ipa-text">—</div>
    </div>

    <audio id="audio" preload="auto"></audio>

    <div class="button-group">
      <button id="prev">이전</button>
      <button id="playOriginal" disabled>▶ 원본 듣기</button>
      <button id="record">● 녹음 시작</button>
      <button id="stop" disabled>■ 녹음 중지</button>
      <button id="playMine" disabled>▶ 내 목소리 듣기</button>
      <a id="downloadMine" class="btn-link disabled">다운로드</a>
      <button id="next">다음</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
